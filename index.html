<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Calculator</title>

  <!-- React & Babel CDN Libraries -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 30% 20%, #241b3d 0%, #14101f 45%, #0a0812 100%);
      font-family: 'Space Grotesk', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
      touch-action: manipulation;
    }

    .eyebrow {
      color: #7f5af0;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 6px;
      text-align: center;
    }

    h1 {
      color: #fffffe;
      font-size: 22px;
      font-weight: 500;
      text-align: center;
      margin: 0 0 22px;
    }

    .calculator {
      background: linear-gradient(160deg, #1e1832 0%, #16121f 100%);
      border: 1px solid rgba(127, 90, 240, 0.25);
      border-radius: 28px;
      padding: 24px;
      width: 320px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .display {
      background: #0a0812;
      border-radius: 18px;
      padding: 22px 20px;
      margin-bottom: 20px;
      text-align: right;
      border: 1px solid rgba(127, 90, 240, 0.15);
      overflow: hidden;
      min-height: 82px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    #previous-operand {
      font-family: 'JetBrains Mono', monospace;
      color: #7f5af0;
      font-size: 14px;
      min-height: 16px;
      white-space: nowrap;
      overflow-x: auto;
      opacity: 0.8;
    }

    #current-operand {
      font-family: 'JetBrains Mono', monospace;
      color: #fffffe;
      font-size: 34px;
      font-weight: 600;
      white-space: nowrap;
      overflow-x: auto;
      text-shadow: 0 0 18px rgba(127, 90, 240, 0.35);
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 16px;
      padding: 18px 0;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 500;
      background: #241d38;
      color: #e4e2f2;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    button:hover { background: #2d2547; }
    button:active { transform: scale(0.93); }

    .operator { background: rgba(127, 90, 240, 0.15); color: #b8a4ff; }
    .operator:hover { background: rgba(127, 90, 240, 0.28); }

    .equals {
      background: linear-gradient(135deg, #7f5af0, #5e3fd1);
      color: #fffffe;
      box-shadow: 0 6px 20px rgba(127, 90, 240, 0.45);
    }
    .equals:hover { box-shadow: 0 6px 26px rgba(127, 90, 240, 0.65); }

    .muted { color: #a7a9be; background: #1c1730; }
    .muted:hover { background: #241d3d; }
  </style>
</head>
<body>

  <div id="root"></div>

  <!-- React Code inside Babel Script -->
  <script type="text/babel">
    const { useState } = React;

    function Calculator() {
      const [expression, setExpression] = useState('');
      const [lastAnswer, setLastAnswer] = useState(0);
      const [previousDisplay, setPreviousDisplay] = useState('Ans = 0');
      const [currentDisplay, setCurrentDisplay] = useState('0');

      const appendNumber = (number) => {
        const updated = expression + number;
        setExpression(updated);
        setCurrentDisplay(updated);
        setPreviousDisplay('');
      };

      const appendSymbol = (symbol) => {
        const updated = expression + ' ' + symbol + ' ';
        setExpression(updated);
        setCurrentDisplay(updated);
        setPreviousDisplay('');
      };

      const calculate = () => {
        if (!expression) return;

        const evalString = expression
          .replaceAll('×', '*')
          .replaceAll('÷', '/')
          .replaceAll('−', '-');

        try {
          const result = eval(evalString);
          if (evalString.includes('/0') && !isFinite(result)) {
            throw new Error('Divide by zero');
          }

          setPreviousDisplay(`${expression} =`);
          setCurrentDisplay(String(result));
          setLastAnswer(result);
          setExpression(String(result));
        } catch (error) {
          setPreviousDisplay(`${expression} =`);
          setCurrentDisplay('Error');
          setExpression('');
        }
      };

      const handleClear = () => {
        setExpression('');
        setLastAnswer(0);
        setCurrentDisplay('0');
        setPreviousDisplay('Ans = 0');
      };

      return (
        <div>
          <p className="eyebrow">Basic Calculator</p>
          <h1>Calculate</h1>

          <div className="calculator">
            <div className="display">
              <div id="previous-operand">{previousDisplay}</div>
              <div id="current-operand">{currentDisplay}</div>
            </div>

            <div className="buttons">
              <button onClick={() => appendSymbol('(')} className="muted">(</button>
              <button onClick={() => appendSymbol(')')} className="muted">)</button>
              <button onClick={() => appendSymbol('%')} className="muted">%</button>
              <button onClick={handleClear} className="muted">CE</button>

              <button onClick={() => appendNumber('7')}>7</button>
              <button onClick={() => appendNumber('8')}>8</button>
              <button onClick={() => appendNumber('9')}>9</button>
              <button onClick={() => appendSymbol('÷')} className="operator">÷</button>

              <button onClick={() => appendNumber('4')}>4</button>
              <button onClick={() => appendNumber('5')}>5</button>
              <button onClick={() => appendNumber('6')}>6</button>
              <button onClick={() => appendSymbol('×')} className="operator">×</button>

              <button onClick={() => appendNumber('1')}>1</button>
              <button onClick={() => appendNumber('2')}>2</button>
              <button onClick={() => appendNumber('3')}>3</button>
              <button onClick={() => appendSymbol('−')} className="operator">−</button>

              <button onClick={() => appendNumber('0')}>0</button>
              <button onClick={() => appendNumber('.')}>.</button>
              <button onClick={calculate} className="equals">=</button>
              <button onClick={() => appendSymbol('+')} className="operator">+</button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Calculator />);
  </script>
</body>
</html>
